version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      golib:
        patterns:
          - github.com/stellwerk-labs/golib*
      opentelemetry:
        patterns:
          - go.opentelemetry.io*
  - package-ecosystem: docker
    directory: /integration-tests
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
  - package-ecosystem: docker
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
