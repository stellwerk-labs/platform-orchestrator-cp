name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install yq
        run: go install github.com/mikefarah/yq/v4@v4.47.2

      - name: Generate
        run: make generate

      - name: Tidy modules
        run: go mod tidy

      - name: Check generated files and modules
        run: git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: make test-unit

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: cover.out

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DP_IMAGE: ghcr.io/stellwerk-labs/platform-orchestrator-dp:nats-candidate
      IAM_IMAGE: ghcr.io/stellwerk-labs/platform-orchestrator-iam:nats-candidate
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Score Compose
        uses: score-spec/setup-score@v3.2.4
        with:
          file: score-compose
          version: 0.17.0

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.0

      - name: Run integration tests
        run: make test-integration

      - name: Show integration logs
        if: always()
        run: make test-integration-logs

      - name: Clean integration environment
        if: always()
        run: make clean

  commitlint:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6.2.1

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - unit
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      issues: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Release
        id: release
        uses: stellwerk-labs/semantic-release-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        if: steps.release.outputs.version != ''
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.release.outputs.version != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.release.outputs.version != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/stellwerk-labs/platform-orchestrator-cp:${{ steps.release.outputs.version }}
