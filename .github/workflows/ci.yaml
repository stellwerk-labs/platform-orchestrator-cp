name: CI

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Pre-existing approved vX.Y.Z-rc.N tag (never stable/latest)"
        required: true
        type: string
      candidate_sha:
        description: "Approved full 40-character commit SHA identified by that tag"
        required: true
        type: string
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  candidate-preflight:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-cp' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout approved candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable candidate and pre-provisioned reviewer approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/public-release-candidate" > "$RUNNER_TEMP/candidate-environment.json"
          python3 scripts/candidate-release.py "$CANDIDATE_TAG" "$CANDIDATE_SHA" \
            --environment-json "$RUNNER_TEMP/candidate-environment.json"

  candidate-release:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-cp' && github.event_name == 'workflow_dispatch'
    needs:
      - candidate-preflight
      - unit
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: public-release-candidate
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Checkout tested immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate candidate and refuse an existing image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/public-release-candidate" > "$RUNNER_TEMP/candidate-environment.json"
          python3 scripts/candidate-release.py "$CANDIDATE_TAG" "$CANDIDATE_SHA" \
            --environment-json "$RUNNER_TEMP/candidate-environment.json" \
            --check-image-absent "$GITHUB_REPOSITORY"

      - name: Reserve candidate release without creating a tag or changing latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          gh release create "$CANDIDATE_TAG" --verify-tag --prerelease --latest=false \
            --title "$CANDIDATE_TAG" --notes-file "docs/releases/$CANDIDATE_TAG.md"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact candidate image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/stellwerk-labs/platform-orchestrator-cp:${{ inputs.candidate_tag }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.version=${{ inputs.candidate_tag }}
            org.opencontainers.image.revision=${{ inputs.candidate_sha }}

      - name: Verify candidate image by immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "ghcr.io/stellwerk-labs/platform-orchestrator-cp@$IMAGE_DIGEST"

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.ref }}

      - name: Test candidate publication contract
        run: python3 scripts/candidate-release_test.py

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Generate
        run: make generate

      - name: Tidy modules
        run: go mod tidy

      - name: Check generated files and modules
        run: git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: make test-unit

      - name: Lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.11.4

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-coverage
          path: cover.out

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IAM_IMAGE: ${{ vars.CORE_IAM_INTEGRATION_IMAGE }}
      DP_IMAGE: ${{ vars.CORE_DP_INTEGRATION_IMAGE }}
    steps:
      - name: Require compatible digest-pinned integration dependencies
        shell: bash
        run: |
          set -euo pipefail
          for image_variable in IAM_IMAGE DP_IMAGE; do
            if [[ ! "${!image_variable}" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Set CORE_${image_variable%_IMAGE}_INTEGRATION_IMAGE to a compatible public image digest before running CI."
              exit 1
            fi
          done
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Score Compose
        uses: score-spec/setup-score@888a7deafd396c3f3f05e00d2d9b0ab225799ac0 # v3.2.4
        with:
          file: score-compose
          version: 0.17.0

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Run integration tests
        run: make test-integration

      - name: Show integration logs
        if: always()
        run: make test-integration-logs

      - name: Clean integration environment
        if: always()
        run: make clean

  commitlint:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: wagoid/commitlint-github-action@6cf16efdf4da5277c791d335142c03a0bdf1766e # v6.2.1

  release:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-cp' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - unit
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Release
        id: release
        uses: stellwerk-labs/semantic-release-action@b1269e93b486873118eef1646bfcd46a9d23d3a3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        if: steps.release.outputs.version != ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Log in to GHCR
        if: steps.release.outputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.release.outputs.version != ''
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/stellwerk-labs/platform-orchestrator-cp:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify published image
        if: steps.release.outputs.version != ''
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          docker buildx imagetools inspect "ghcr.io/stellwerk-labs/platform-orchestrator-cp@${IMAGE_DIGEST}"
