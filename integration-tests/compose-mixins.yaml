services:
  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222", "--auth", "integration-token"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz | grep -q ok"]
      interval: 2s
      timeout: 5s
      retries: 15
  platform-orchestrator-dp-platform-orchestrator-dp:
    environment:
      NATS_BOOTSTRAP: "true"
      LOG_LEVEL: debug
      DD_AGENT_HOST: ""
      SHUTDOWN_DELAY: 1s
      DEPLOYMENTS_COMPLETED_BEFORE: 10s
      VAULT_AUTH: token:mytoken
    depends_on:
      nats:
        condition: service_healthy
      vault:
        condition: service_started
  platform-orchestrator-cp-platform-orchestrator-cp:
    environment:
      DD_AGENT_HOST: ""
      SHUTDOWN_DELAY: 1s
      LOG_LEVEL: debug
      VAULT_AUTH: token:mytoken
      NATS_BOOTSTRAP_STREAMS: "true"
    depends_on:
      nats:
        condition: service_healthy
      vault:
        condition: service_started
      platform-orchestrator-iam-platform-orchestrator-iam:
        condition: service_started
  platform-orchestrator-iam-platform-orchestrator-iam:
    environment:
      LOG_LEVEL: debug
      DD_AGENT_HOST: ""
      SHUTDOWN_DELAY: 1s
  vault:
    image: hashicorp/vault:1.14
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: mytoken
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
