services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "9000:9000"

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb local/runner-logs --ignore-existing"]
    labels:
      dev.score.compose.labels.is-init-container: "true"

  platform-orchestrator-dp-platform-orchestrator-dp:
    environment:
      LOG_LEVEL: debug
      DD_AGENT_HOST: ""
      SHUTDOWN_DELAY: 1s
      DEPLOYMENTS_COMPLETED_BEFORE: 10s
      VAULT_AUTH: token:mytoken
    depends_on:
      vault:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
  platform-orchestrator-cp-platform-orchestrator-cp:
    environment:
      DD_AGENT_HOST: ""
      SHUTDOWN_DELAY: 1s
      LOG_LEVEL: debug
      VAULT_AUTH: token:mytoken
    depends_on:
      vault:
        condition: service_started
      platform-orchestrator-iam-platform-orchestrator-iam:
        condition: service_started
  platform-orchestrator-iam-platform-orchestrator-iam:
    environment:
      LOG_LEVEL: debug
      DD_AGENT_HOST: ""
      SHUTDOWN_DELAY: 1s
    depends_on:
      spicedb:
        condition: service_healthy
  vault:
    image: hashicorp/vault:1.14
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: mytoken
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
  spicedb:
    image: authzed/spicedb:v1.45.4
    command: serve-testing
    ports:
      - "50051:50051"
      - "8443:8443"
      - "9090:9090"  
    environment:
      - SPICEDB_GRPC_PRESHARED_KEY=t0k3n
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-v", "-addr=localhost:50051"]
      interval: 5s
      timeout: 3s
      retries: 3